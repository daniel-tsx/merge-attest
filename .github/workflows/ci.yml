name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mergeattest?schema=public
      BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_APP_ID: '12345'
      GITHUB_APP_SLUG: mergeattest-ci
      GITHUB_APP_PRIVATE_KEY: ci-placeholder-private-key
      GITHUB_WEBHOOK_SECRET: ci-placeholder-github-webhook-secret
      ENABLE_PAID_BILLING: 'false'
      JOB_RUNNER_SECRET: ci-placeholder-job-runner-secret
      EMAIL_FROM: 'MergeAttest CI <noreply@example.com>'
      RESEND_API_KEY: ci-placeholder-resend-api-key
      SUPPORT_EMAIL: support@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Build
        run: pnpm build
